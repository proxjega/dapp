<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent – RealEstate DApp</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="script.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
  </head>

  <body class="bg-light p-4">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">RealEstate DApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link disabled"
                style="color:darkgray">Choose your account:</a></li>
            <div class="nav-item dropdown">
              <button class="nav-link dropdown-toggle" id="accountDropdown"
                type="button"
                data-bs-toggle="dropdown" aria-expanded="false">
                Select Account
              </button>
              <ul class="dropdown-menu dropdown-menu-end dropdown-menu-lg-end"
                id="accountList">
                <li>a</li>
              </ul>
            </div>

            <li class="nav-item"><a class="nav-link"
                href="buyer.html">Buyer</a></li>
            <li class="nav-item"><a class="nav-link"
                href="seller.html">Seller</a></li>
            <li class="nav-item"><a class="nav-link"
                href="agent.html">Agent</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">

      <!-- PROPOSE PRICE -->
      <h2 class="mb-3">Propose Price</h2>

      <div class="mb-3">
        <label class="form-label">Offer ID</label>
        <input id="propOfferId" type="number" class="form-control"
          placeholder="Enter offer ID" />
      </div>

      <div class="mb-3">
        <label class="form-label">Price (wei or ETH depending on your
          script.js)</label>
        <input id="propPrice" type="number" class="form-control"
          placeholder="Enter price" />
      </div>

      <button class="btn btn-primary" onclick="proposePrice()">Submit
        Price</button>
      <p id="propStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <!-- FIND BUYER -->
      <h2 class="mb-3">Add Buyer</h2>

      <div class="mb-3">
        <label class="form-label">Offer ID</label>
        <input id="findOfferId" type="number" class="form-control"
          placeholder="Enter offer ID" />
      </div>

      <div class="mb-3">
        <label class="form-label">Buyer Address</label>
        <input id="buyerAddress" type="text" class="form-control"
          placeholder="0x..." />
      </div>

      <button class="btn btn-warning" onclick="findBuyer()">Add Buyer</button>
      <p id="findStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <!-- GET FUNDS -->
      <h2 class="mb-3">Withdraw Funds</h2>

      <button class="btn btn-success"
        onclick="withdrawFunds()">Withdraw</button>
      <p id="withdrawStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <!-- SEE OFFER -->
      <h2 class="mb-3">Get offer info</h2>

      <div class="mb-3">
        <label class="form-label">Offer ID</label>
        <input id="seeOfferId" type="number" class="form-control"
          placeholder="Enter offer ID" />
      </div>

      <button class="btn btn-info" onclick="loadOffer()">Load Offer</button>

      <pre id="offerData" class="bg-white p-3 border rounded mt-3"></pre>

    </div>

    <script src="script.js"></script>
  </body>
</html>
