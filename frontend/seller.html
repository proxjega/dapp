<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealEstate DApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <script src="script.js">
  </script>
  </head>
  <body class="bg-light p-4">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">RealEstate DApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link disabled"
                style="color:darkgray">Choose your account:</a></li>
            <div class="nav-item dropdown">
              <button class="nav-link dropdown-toggle" id="accountDropdown"
                type="button"
                data-bs-toggle="dropdown" aria-expanded="false">
                Select Account
              </button>
              <ul class="dropdown-menu dropdown-menu-end dropdown-menu-lg-end"
                id="accountList">
                <li>a</li>
              </ul>
            </div>

            <li class="nav-item"><a class="nav-link"
                href="buyer.html">Buyer</a></li>
            <li class="nav-item"><a class="nav-link"
                href="seller.html">Seller</a></li>
            <li class="nav-item"><a class="nav-link"
                href="agent.html">Agent</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">

      <h2 class="mb-3">Create Offer</h2>
      <div class="mb-3">
        <label class="form-label">Housing Info Hash (bytes32)</label>
        <input id="hashInput" type="text" class="form-control"
          placeholder="0x..." />
      </div>
      <div class="mb-3">
        <label class="form-label">Agent Address</label>
        <input id="agentInput" type="text" class="form-control"
          placeholder="0x..." />
      </div>
      <button class="btn btn-primary" onclick="createOffer()">Create
        Offer</button>
      <p id="createStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <h2 class="mb-3">Accept/Decline proposed price</h2>
      <div class="mb-3">
        <label for="acceptOfferId" class="form-label">Offer ID</label>
        <input type="number" class="form-control" id="acceptOfferId"
          placeholder="Enter offer ID">
      </div>
      <div class="mb-3">
      </div>
      <button class="btn btn-primary" id="acceptOfferBtn" onclick="acceptOffer(true)">Accept</button>
      <button class="btn btn-danger" id="acceptOfferBtn" onclick="acceptOffer(false)">Decline</button>
      <p id="acceptStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <h2 class="mb-3">Withdraw Funds</h2>

      <button class="btn btn-success"
        onclick="withdrawFunds()">Withdraw</button>
      <p id="withdrawStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <h2 class="mb-3">Get offer info</h2>

      <div class="mb-3">
        <label class="form-label">Offer ID</label>
        <input id="seeOfferId" type="number" class="form-control"
          placeholder="Enter offer ID" />
      </div>

      <button class="btn btn-info" onclick="loadOffer()">Load Offer</button>

      <pre id="offerData" class="bg-white p-3 border rounded mt-3"></pre>
    </div>

  </body>
</html>
