<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealEstate DApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script
      src="https://cdn.jsdelivr.net/npm/ethers@6.8.1/dist/ethers.umd.min.js"></script>
  </head>
  <body class="bg-light p-4">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 rounded-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">RealEstate DApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link"
                href="buyer.html">Buyer</a></li>
            <li class="nav-item"><a class="nav-link"
                href="seller.html">Seller</a></li>
            <li class="nav-item"><a class="nav-link"
                href="agent.html">Agent</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">

      <h2 class="mb-3">Accept/Decline Offer</h2>
      <div class="mb-3">
        <label for="acceptOfferId" class="form-label">Offer ID</label>
        <input type="number" class="form-control" id="acceptOfferId"
          placeholder="Enter offer ID">
      </div>
      <div class="mb-3">
        <label class="form-label">Action</label>
        <select class="form-select" id="acceptAction">
          <option value="true">Accept</option>
          <option value="false">Decline</option>
        </select>
      </div>
      <button class="btn btn-primary" id="acceptOfferBtn">Accept</button>
      <button class="btn btn-danger" id="acceptOfferBtn">Decline</button>
      <p id="createStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <h2 class="mb-3">Pay</h2>
      <div class="mb-3">
        <label for="payOfferId" class="form-label">Offer ID</label>
        <input type="number" class="form-control" id="payOfferId"
          placeholder="Enter offer ID">
      </div>
      <div class="mb-3">
        <label for="payAmount" class="form-label">Amount (in Wei)</label>
        <input type="number" class="form-control" id="payAmount"
          placeholder="Enter amount">
      </div>
      <button class="btn btn-success" id="payOfferBtn">Pay</button>
      <p id="createStatus" class="mt-3 text-muted"></p>

      <hr class="my-4" />

      <h2 class="mb-3">Get offer info</h2>

      <div class="mb-3">
        <label class="form-label">Offer ID</label>
        <input id="seeOfferId" type="number" class="form-control"
          placeholder="Enter offer ID" />
      </div>

      <button class="btn btn-info" onclick="loadOffer()">Load Offer</button>

      <pre id="offerData" class="bg-white p-3 border rounded mt-3"></pre>
    </div>

    <script src="script.js">
  </script>
  </body>
</html>
